name: Infra — spin up

on:
  workflow_dispatch:

jobs:
  deploy-infra:
    uses: ./.github/workflows/infra-deploy.yml
    secrets: inherit

  bootstrap-rbac:
    needs: deploy-infra
    uses: ./.github/workflows/infra-bootstrap-rbac.yml
    secrets: inherit

  refresh-swa-token:
    name: Refresh SWA deploy token
    needs: bootstrap-rbac
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      secrets: write
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Refresh Static Web App deploy token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name stapp-dostar-dev-aue-001 \
            --resource-group rg-dostar-dev-aue-001 \
            --query "properties.apiKey" -o tsv)
          gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN_DEV --body "$TOKEN"
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN_DEV updated."

  deploy-backend:
    needs: refresh-swa-token
    uses: ./.github/workflows/cd-backend.yml
    secrets: inherit

  deploy-frontend:
    needs: deploy-backend
    uses: ./.github/workflows/cd-frontend.yml
    secrets: inherit
