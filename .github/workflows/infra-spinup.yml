name: Infra — spin up

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-infra:
    uses: ./.github/workflows/infra-deploy.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit

  bootstrap-rbac:
    needs: deploy-infra
    uses: ./.github/workflows/infra-bootstrap-rbac.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit

  deploy-backend:
    needs: bootstrap-rbac
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit

  deploy-frontend:
    needs: deploy-backend
    uses: ./.github/workflows/cd-frontend.yml
    with:
      environment: ${{ inputs.environment || 'dev' }}
    secrets: inherit

  summarize:
    name: Print environment URLs
    needs: deploy-frontend
    environment:
      name: dev
      url: ${{ steps.print-urls.outputs.url }}
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Print environment URLs
        id: print-urls
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ca-dostar-dev-aue-001 \
            --resource-group rg-dostar-dev-aue-001 \
            --query properties.configuration.ingress.fqdn -o tsv)
          FRONTEND_HOSTNAME=$(az staticwebapp show \
            --name stapp-dostar-dev-aue-001 \
            --resource-group rg-dostar-dev-aue-001 \
            --query defaultHostname -o tsv)
          echo "url=https://$FRONTEND_HOSTNAME" >> "$GITHUB_OUTPUT"
          {
            echo "## Environment ready"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Frontend | https://$FRONTEND_HOSTNAME |"
            echo "| Backend health | https://$BACKEND_FQDN/healthz/live |"
            echo "| API docs | https://$BACKEND_FQDN/scalar/v1 |"
          } >> "$GITHUB_STEP_SUMMARY"
