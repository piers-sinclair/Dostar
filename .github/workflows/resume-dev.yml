name: Dev — resume

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write

jobs:
  resume:
    name: Resume dev environment
    runs-on: ubuntu-latest

    steps:
      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          POSTGRES_SERVER_NAME: ${{ secrets.POSTGRES_SERVER_NAME }}
          RESOURCE_GROUP: ${{ secrets.RESOURCE_GROUP }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]       && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]       && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ] && MISSING+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$POSTGRES_SERVER_NAME" ]  && MISSING+=("POSTGRES_SERVER_NAME")
          [ -z "$RESOURCE_GROUP" ]        && MISSING+=("RESOURCE_GROUP")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            echo "Follow docs/deploy-setup.md to configure OIDC credentials and deployment secrets."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start PostgreSQL
        run: |
          az postgres flexible-server start \
            --name "${{ secrets.POSTGRES_SERVER_NAME }}" \
            --resource-group "${{ secrets.RESOURCE_GROUP }}"

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in $(seq 1 20); do
            STATE=$(az postgres flexible-server show \
              --name "${{ secrets.POSTGRES_SERVER_NAME }}" \
              --resource-group "${{ secrets.RESOURCE_GROUP }}" \
              --query "state" -o tsv)
            echo "State: $STATE ($i/20)"
            [ "$STATE" = "Ready" ] && break
            sleep 15
          done

      - name: Trigger backend deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cd-dev.yml --repo "${{ github.repository }}"

      - name: Trigger frontend deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cd-frontend-dev.yml --repo "${{ github.repository }}"
          echo "Backend and frontend deploy workflows triggered — dev environment will be fully ready shortly."
