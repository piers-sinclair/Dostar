name: Infra — what-if

on:
  pull_request:
    branches: [main]
    paths:
      - 'infra/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  whatif:
    name: Bicep what-if (dev)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if
        id: whatif
        run: |
          OUTPUT=$(az deployment sub what-if \
            --location australiaeast \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.dev.bicepparam \
            --no-pretty-print \
            2>&1) || true

          # Truncate to stay within GitHub comment size limits (65 536 chars)
          MAX=64000
          if [ ${#OUTPUT} -gt $MAX ]; then
            OUTPUT="${OUTPUT:0:$MAX}
          ... (output truncated — see workflow logs for full output)"
          fi

          # Store as multiline env var
          EOF_MARKER=$(openssl rand -hex 8)
          echo "WHATIF_OUTPUT<<$EOF_MARKER" >> "$GITHUB_ENV"
          echo "$OUTPUT" >> "$GITHUB_ENV"
          echo "$EOF_MARKER" >> "$GITHUB_ENV"

      - name: Post what-if as PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Bicep what-if — dev environment

            <details>
            <summary>Click to expand</summary>

            ```
            ${{ env.WHATIF_OUTPUT }}
            ```

            </details>

            > Generated from `infra/main.parameters.dev.bicepparam` against the `australiaeast` subscription scope.
