name: Infra — what-if

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check infra paths
        id: filter
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -qE '^infra/'; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
          else
            echo "infra=false" >> "$GITHUB_OUTPUT"
          fi

  whatif:
    name: Bicep what-if (run)
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]       && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]       && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ] && MISSING+=("AZURE_SUBSCRIPTION_ID")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            echo "Follow docs/deploy-setup.md to configure OIDC credentials and add these secrets to the repository."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run what-if and post PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD || 'WhatIfPlaceholder' }}
          AZURE_POSTGRES_ADMIN_USERNAME: ${{ secrets.AZURE_POSTGRES_ADMIN_USERNAME || 'whatifuser' }}
        run: |
          OUTPUT=$(az deployment sub what-if \
            --location australiaeast \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.dev.bicepparam \
            --no-pretty-print \
            2>&1) || true

          # Truncate to stay within GitHub comment size limits (65 536 chars)
          MAX=64000
          if [ ${#OUTPUT} -gt $MAX ]; then
            OUTPUT="${OUTPUT:0:$MAX}
          ... (output truncated — see workflow logs for full output)"
          fi

          BODY="## Bicep what-if — dev environment

          <details>
          <summary>Click to expand</summary>

          \`\`\`
          ${OUTPUT}
          \`\`\`

          </details>

          > Generated from \`infra/main.parameters.dev.bicepparam\` against the \`australiaeast\` subscription scope."

          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          MARKER="Bicep what-if — dev environment"

          # Update existing bot comment if present, otherwise create a new one
          COMMENT_ID=$(gh api "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$MARKER\"))) | .id" \
            | head -1)

          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$BODY"
          fi

  infra-checks:
    name: Bicep what-if
    needs: [changes, whatif]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          WHATIF_RESULT: ${{ needs.whatif.result }}
        run: |
          if [[ "$CHANGES_RESULT" == "failure" || "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "::error::Path detection failed ($CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$WHATIF_RESULT" == "failure" || "$WHATIF_RESULT" == "cancelled" ]]; then
            echo "::error::Bicep what-if failed ($WHATIF_RESULT)"
            exit 1
          fi
