name: Infra — deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: choice
        options: [dev, prod]
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Bicep (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          AZURE_POSTGRES_ADMIN_USERNAME: ${{ secrets.AZURE_POSTGRES_ADMIN_USERNAME }}
          ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]               && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]               && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ]         && MISSING+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$AZURE_POSTGRES_ADMIN_PASSWORD" ] && MISSING+=("AZURE_POSTGRES_ADMIN_PASSWORD")
          [ -z "$AZURE_POSTGRES_ADMIN_USERNAME" ]       && MISSING+=("AZURE_POSTGRES_ADMIN_USERNAME")
          [ -z "$ALERT_EMAIL_ADDRESS" ]           && MISSING+=("ALERT_EMAIL_ADDRESS")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get current container image
        id: current-image
        run: |
          ENV="${{ inputs.environment || 'dev' }}"
          IMAGE=$(az containerapp show \
            --name "ca-dostar-${ENV}-aue-001" \
            --resource-group "rg-dostar-${ENV}-aue-001" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Deploy infrastructure
        env:
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          AZURE_POSTGRES_ADMIN_USERNAME: ${{ secrets.AZURE_POSTGRES_ADMIN_USERNAME }}
          ALERT_EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL_ADDRESS }}
        run: |
          PARAMS=(--parameters infra/main.parameters.${{ inputs.environment || 'dev' }}.bicepparam)
          IMAGE="${{ steps.current-image.outputs.image }}"
          [ -n "$IMAGE" ] && PARAMS+=(--parameters "containerImage=$IMAGE")
          az deployment sub create \
            --name dostar-${{ inputs.environment || 'dev' }} \
            --location australiaeast \
            --template-file infra/main.bicep \
            "${PARAMS[@]}" \
            --only-show-errors

      - name: Get environment URLs
        id: get-urls
        run: |
          BACKEND_FQDN=$(az deployment sub show \
            --name dostar-${{ inputs.environment || 'dev' }} \
            --query 'properties.outputs.containerAppFqdn.value' -o tsv)
          FRONTEND_HOSTNAME=$(az deployment sub show \
            --name dostar-${{ inputs.environment || 'dev' }} \
            --query 'properties.outputs.staticWebAppHostname.value' -o tsv)
          echo "backend_fqdn=$BACKEND_FQDN" >> "$GITHUB_OUTPUT"
          echo "frontend_hostname=$FRONTEND_HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        # Skip when called from infra-spinup: the real backend image has not been deployed yet
        # at this point in the chain, so the Container App is still on the placeholder image which
        # has no /healthz endpoints. cd-backend.yml runs its own smoke test after the real image is live.
        if: github.event_name != 'workflow_call'
        run: |
          FQDN="${{ steps.get-urls.outputs.backend_fqdn }}"
          for i in {1..20}; do
            LIVE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "https://$FQDN/healthz/live" || echo "000")
            READY=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "https://$FQDN/healthz/ready" || echo "000")
            if [ "$LIVE" = "200" ] && [ "$READY" = "200" ]; then
              echo "Smoke tests passed (/healthz/live=$LIVE, /healthz/ready=$READY)"
              exit 0
            fi
            echo "Attempt $i/20: /healthz/live=$LIVE, /healthz/ready=$READY — retrying in 15s"
            sleep 15
          done
          echo "::error::Smoke test failed after 20 attempts"
          exit 1

      - name: Print environment URLs
        if: success()
        run: |
          BACKEND_FQDN="${{ steps.get-urls.outputs.backend_fqdn }}"
          FRONTEND_HOSTNAME="${{ steps.get-urls.outputs.frontend_hostname }}"
          {
            echo "## Infrastructure deployed"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Frontend | https://$FRONTEND_HOSTNAME |"
            echo "| Backend health | https://$BACKEND_FQDN/healthz/live |"
            echo "| API docs | https://$BACKEND_FQDN/scalar/v1 |"
          } >> "$GITHUB_STEP_SUMMARY"
