name: Infra — deploy

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy Bicep (dev)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]               && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]               && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ]         && MISSING+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$AZURE_POSTGRES_ADMIN_PASSWORD" ] && MISSING+=("AZURE_POSTGRES_ADMIN_PASSWORD")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            echo "See docs/deploy-setup.md for setup instructions."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        env:
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --name dostar-dev \
            --location australiaeast \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.dev.bicepparam \
            --only-show-errors

      - name: Print environment URLs
        run: |
          BACKEND_FQDN=$(az deployment sub show \
            --name dostar-dev \
            --query 'properties.outputs.containerAppFqdn.value' -o tsv)
          FRONTEND_HOSTNAME=$(az deployment sub show \
            --name dostar-dev \
            --query 'properties.outputs.staticWebAppHostname.value' -o tsv)
          {
            echo "## Infrastructure deployed"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Frontend | https://$FRONTEND_HOSTNAME |"
            echo "| Backend health | https://$BACKEND_FQDN/healthz/live |"
            echo "| API docs | https://$BACKEND_FQDN/scalar/v1 |"
          } >> "$GITHUB_STEP_SUMMARY"
