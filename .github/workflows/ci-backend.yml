name: CI — Backend

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check backend paths
        id: filter
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -qE '^(backend/|tools/|[^/]+\.(slnx|sln)$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Backend — build & test (run)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Verify OpenAPI spec is up to date
        run: git diff --exit-code backend/Dostar.Api.json

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Install coverlet
        run: dotnet tool install coverlet.console --tool-path ./tools

      - name: Unit tests
        timeout-minutes: 15
        run: bash tools/run-tests.sh unit

      - name: Integration tests
        timeout-minutes: 30
        run: bash tools/run-tests.sh integration

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/

  backend-checks:
    name: Backend — build & test
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGES_RESULT" == "failure" || "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "::error::Path detection failed ($CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "::error::Build failed ($BUILD_RESULT)"
            exit 1
          fi
