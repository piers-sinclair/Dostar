name: CI — Backend

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "tools/**"
      - "*.slnx"
      - "*.sln"

jobs:
  backend-checks:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Verify OpenAPI spec is up to date
        run: git diff --exit-code backend/Dostar.Api.json

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Install coverlet
        run: dotnet tool install coverlet.console --tool-path ./tools

      - name: Unit tests
        timeout-minutes: 15
        run: bash tools/run-tests.sh unit

      - name: Integration tests
        timeout-minutes: 30
        run: bash tools/run-tests.sh integration

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
