name: Deploy Dev

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-dostar-dev-aue-001
  AZURE_LOCATION: australiaeast
  ACR_NAME: crdostardevaue001
  IMAGE_NAME: api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build API Docker image
        run: |
          docker build -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} ./backend/Dostar.Api

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Push image
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy Bicep
        run: |
          az deployment group create \
            --resource-group $AZURE_RESOURCE_GROUP \
            --template-file infra/main.json \
            --parameters \
              location=$AZURE_LOCATION \
              postgresAdminPassword=${{ secrets.POSTGRES_ADMIN_PASSWORD }}
