name: CD — release to prod

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: prod
    secrets: inherit

  deploy-frontend:
    needs: deploy-backend
    uses: ./.github/workflows/cd-frontend.yml
    with:
      environment: prod
    secrets: inherit
