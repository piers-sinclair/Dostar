# Prod promotion gate — called by release-please.yml when it creates a release.
#
# Flow:
#   1. Merge feat:/fix: commits to main  →  auto-deploys to dev
#   2. release-please opens/updates a Release PR (chore(main): release X.Y.Z)
#   3. Team merges the Release PR  →  release-please creates tag + GitHub Release
#      and calls this workflow directly (workflow_call)
#   4. This workflow fires  →  migrates + deploys backend to prod, then frontend
#
# Called via workflow_call (no extra secrets or tokens needed) rather than
# push: tags, because GitHub blocks workflows triggered by GITHUB_TOKEN-authored
# events from firing other workflows.
#
# workflow_dispatch is retained as a manual escape hatch (e.g. re-deploy a
# specific release without re-tagging).
#
# The Release PR only touches CHANGELOG.md and .release-please-manifest.json,
# so it never matches the path filters on cd-backend.yml or cd-frontend.yml
# and will not trigger a spurious dev redeploy.

name: CD — release to prod

on:
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-backend:
    uses: ./.github/workflows/cd-backend.yml
    with:
      environment: prod
    secrets: inherit

  deploy-frontend:
    needs: deploy-backend
    uses: ./.github/workflows/cd-frontend.yml
    with:
      environment: prod
    secrets: inherit
