name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    name: Frontend — lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

  format-backend:
    name: Backend — dotnet format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes

  trivy-scan:
    name: Security — Trivy vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Run Trivy (filesystem — NuGet + npm)
        # Fails on any CVE at any severity. To suppress a known/accepted
        # vulnerability, add its CVE ID to .trivyignore at the repo root.
        run: trivy fs --exit-code 1 .

  opengrep-scan:
    name: Security — OpenGrep SAST
    runs-on: ubuntu-latest
    container:
      image: opengrep/opengrep:latest

    steps:
      - uses: actions/checkout@v6

      - name: Run OpenGrep
        # OpenGrep is a fully LGPL 2.1 fork of Semgrep with no commercial restrictions.
        # --config auto uses the OpenGrep community rule-set (LGPL 2.1).
        # --error exits non-zero when findings are present.
        run: opengrep ci --config auto --error
