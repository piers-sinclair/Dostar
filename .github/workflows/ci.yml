name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend — build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Verify formatting
        run: dotnet format --verify-no-changes

      - name: Test
        run: dotnet test tests/Dostar.Todos.Tests --no-build -c Release

  frontend-checks:
    name: Frontend — build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Build
        run: pnpm build

  trivy-scan:
    name: Security — Trivy vulnerability scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Run Trivy (filesystem — NuGet + npm)
        # Fails on any CVE at any severity. To suppress a known/accepted
        # vulnerability, add its CVE ID to .trivyignore at the repo root.
        run: trivy fs --exit-code 1 .

  opengrep-scan:
    name: Security — OpenGrep SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install OpenGrep
        run: |
          latest=$(curl -sf "https://api.github.com/repos/opengrep/opengrep/releases/latest" \
            | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          curl -fsSL "https://github.com/opengrep/opengrep/releases/download/${latest}/opengrep_manylinux_x86" \
            -o opengrep
          chmod +x opengrep
          sudo mv opengrep /usr/local/bin/opengrep

      - name: Run OpenGrep
        run: opengrep ci --config auto
