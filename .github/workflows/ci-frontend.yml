name: CI — Frontend

on:
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check frontend paths
        id: filter
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
              | grep -qE '^frontend/|^backend/Dostar\.Api\.json'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  deps:
    name: Dependency gate (pnpm policy check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (strict)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

  build:
    name: Frontend — build & lint
    needs: [changes, deps]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

      - name: Verify generated API client is up to date
        run: pnpm generate:api && git diff --exit-code src/shared/api/generated/

      - name: Build
        run: pnpm build

  frontend-checks:
    name: Frontend — final check
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$CHANGES_RESULT" == "failure" || "$CHANGES_RESULT" == "cancelled" ]]; then
            echo "::error::Path detection failed ($CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "::error::Build failed ($BUILD_RESULT)"
            exit 1
          fi
