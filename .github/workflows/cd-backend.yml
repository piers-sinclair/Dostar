name: CD — deploy backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "Dockerfile"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: choice
        options: [dev, prod]
      image_tag:
        description: Image tag to deploy (prod only; omit to build from current commit)
        required: false
        type: string
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: string

permissions:
  id-token: write
  contents: read

env:
  ENV: ${{ inputs.environment || 'dev' }}
  AZURE_RESOURCE_GROUP: rg-dostar-${{ inputs.environment || 'dev' }}-aue-001
  ACR_NAME: crdostar${{ inputs.environment || 'dev' }}aue001
  IMAGE_NAME: api
  MIGRATOR_IMAGE_NAME: migrator
  CONTAINER_APP_NAME: ca-dostar-${{ inputs.environment || 'dev' }}-aue-001
  CONTAINER_APP_ENV_NAME: cae-dostar-${{ inputs.environment || 'dev' }}-aue-001
  MIGRATE_JOB_NAME: ca-migrate

jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          AZURE_POSTGRES_ADMIN_USERNAME: ${{ secrets.AZURE_POSTGRES_ADMIN_USERNAME }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]                   && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]                   && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ]             && MISSING+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$AZURE_POSTGRES_ADMIN_PASSWORD" ]     && MISSING+=("AZURE_POSTGRES_ADMIN_PASSWORD")
          [ -z "$AZURE_POSTGRES_ADMIN_USERNAME" ]     && MISSING+=("AZURE_POSTGRES_ADMIN_USERNAME")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build migrator image
        run: |
          docker build --target migrator \
            -t $ACR_NAME.azurecr.io/$MIGRATOR_IMAGE_NAME:${{ github.sha }} .

      - name: Push migrator image
        run: |
          az acr login --name $ACR_NAME
          docker push $ACR_NAME.azurecr.io/$MIGRATOR_IMAGE_NAME:${{ github.sha }}

      - name: Run migrations via Container Apps Job
        env:
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
          AZURE_POSTGRES_ADMIN_USERNAME: ${{ secrets.AZURE_POSTGRES_ADMIN_USERNAME }}
        run: |
          # Construct connection string from Bicep deployment outputs
          FQDN=$(az deployment sub show \
            --name dostar-$ENV \
            --query 'properties.outputs.postgresServerFqdn.value' -o tsv)
          DB_NAME=$(az deployment sub show \
            --name dostar-$ENV \
            --query 'properties.outputs.postgresDatabaseName.value' -o tsv)
          CONNECTION_STRING="Host=$FQDN;Port=5432;Database=$DB_NAME;Username=$AZURE_POSTGRES_ADMIN_USERNAME;Password=$AZURE_POSTGRES_ADMIN_PASSWORD;Ssl Mode=Require;Trust Server Certificate=true"

          # Temporary ACR token (1h TTL) so the job can pull the migrator image
          ACR_TOKEN=$(az acr login --name $ACR_NAME --expose-token --output tsv --query accessToken)

          # Remove any stale job left by a previous failed run
          az containerapp job delete \
            --name $MIGRATE_JOB_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --yes 2>/dev/null || true

          # Create the job inside the VNet-integrated CAE so it can reach the private PostgreSQL server
          az containerapp job create \
            --name $MIGRATE_JOB_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --environment $CONTAINER_APP_ENV_NAME \
            --trigger-type Manual \
            --replica-timeout 300 \
            --replica-retry-limit 0 \
            --image "$ACR_NAME.azurecr.io/$MIGRATOR_IMAGE_NAME:${{ github.sha }}" \
            --registry-server "$ACR_NAME.azurecr.io" \
            --registry-username "00000000-0000-0000-0000-000000000000" \
            --registry-password "$ACR_TOKEN" \
            --secrets "conn-string=$CONNECTION_STRING" \
            --env-vars "ConnectionStrings__Default=secretref:conn-string"

          # Trigger an execution
          EXECUTION_NAME=$(az containerapp job start \
            --name $MIGRATE_JOB_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --query name -o tsv)
          echo "Execution: $EXECUTION_NAME"

          # Poll until Succeeded or Failed (max 5 min)
          for i in $(seq 1 30); do
            STATUS=$(az containerapp job execution list \
              --name $MIGRATE_JOB_NAME \
              --resource-group $AZURE_RESOURCE_GROUP \
              --query "[?name=='$EXECUTION_NAME'].properties.status | [0]" \
              --output tsv 2>/dev/null)
            [ -z "$STATUS" ] && STATUS="Pending"
            echo "[$i/30] $STATUS"
            if [ "$STATUS" = "Succeeded" ]; then
              echo "Migrations completed"
              break
            fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Stopped" ] || [ "$STATUS" = "Degraded" ]; then
              echo "::error::Migration job $STATUS"
              exit 1
            fi
            [ "$i" -eq 30 ] && { echo "::error::Timed out waiting for migration"; exit 1; }
            sleep 10
          done

          # Clean up
          az containerapp job delete \
            --name $MIGRATE_JOB_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --yes --no-wait

  deploy:
    name: Deploy backend (${{ inputs.environment || 'dev' }})
    needs: migrate
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: ${{ steps.get-url.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ] && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ] && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ] && MISSING+=("AZURE_SUBSCRIPTION_ID")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Record current image (for rollback on failure)
        id: rollback_ref
        run: |
          IMAGE=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query "properties.template.containers[0].image" -o tsv 2>/dev/null || echo "")
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: image_tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build API Docker image
        if: steps.image_tag.outputs.build == 'true'
        run: |
          docker build -f Dockerfile -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Push image
        if: steps.image_tag.outputs.build == 'true'
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp registry set \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --server $ACR_NAME.azurecr.io \
            --identity system
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ steps.image_tag.outputs.tag }}

      - name: Get Container App URL
        id: get-url
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        id: smoke_test
        run: |
          FQDN="${{ steps.get-url.outputs.fqdn }}"
          for i in {1..20}; do
            LIVE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "https://$FQDN/healthz/live" || echo "000")
            READY=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "https://$FQDN/healthz/ready" || echo "000")
            if [ "$LIVE" = "200" ] && [ "$READY" = "200" ]; then
              echo "Smoke tests passed (/healthz/live=$LIVE, /healthz/ready=$READY)"
              exit 0
            fi
            echo "Attempt $i/20: /healthz/live=$LIVE, /healthz/ready=$READY — retrying in 15s"
            sleep 15
          done
          echo "::error::Smoke test failed after 20 attempts"
          exit 1

      - name: Print environment URLs
        if: success()
        run: |
          FQDN="${{ steps.get-url.outputs.fqdn }}"
          {
            echo "## Backend deployed"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Backend health | https://$FQDN/healthz/live |"
            echo "| API docs | https://$FQDN/scalar/v1 |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Rollback on smoke test failure (prod only)
        if: failure() && steps.smoke_test.outcome == 'failure' && env.ENV == 'prod' && steps.rollback_ref.outputs.image != ''
        run: |
          echo "::warning::Smoke test failed — rolling back to ${{ steps.rollback_ref.outputs.image }}"
          az containerapp update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "${{ steps.rollback_ref.outputs.image }}"
          echo "Rollback complete."
