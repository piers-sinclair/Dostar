name: CD — deploy backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "Dockerfile"
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

env:
  AZURE_RESOURCE_GROUP: rg-dostar-dev-aue-001
  ACR_NAME: crdostardevaue001
  IMAGE_NAME: api
  CONTAINER_APP_NAME: ca-dostar-dev-aue-001

jobs:
  migrate:
    name: Run database migrations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]                  && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]                  && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ]            && MISSING+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$AZURE_POSTGRES_ADMIN_PASSWORD" ]    && MISSING+=("AZURE_POSTGRES_ADMIN_PASSWORD")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Run EF Core migrations
        env:
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          FQDN=$(az deployment sub show \
            --name dostar-dev \
            --query 'properties.outputs.postgresServerFqdn.value' -o tsv)
          DB_NAME=$(az deployment sub show \
            --name dostar-dev \
            --query 'properties.outputs.postgresDatabaseName.value' -o tsv)
          export ConnectionStrings__Default="Host=$FQDN;Port=5432;Database=$DB_NAME;Username=dostaradmin;Password=$AZURE_POSTGRES_ADMIN_PASSWORD;Ssl Mode=Require;Trust Server Certificate=true"
          bash tools/run-migrations.sh

  deploy:
    name: Deploy app (dev)
    needs: migrate
    environment:
      name: dev
      url: ${{ steps.get-url.outputs.url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ] && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ] && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ] && MISSING+=("AZURE_SUBSCRIPTION_ID")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            exit 1
          fi

      - name: Azure Login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build API Docker image
        run: |
          docker build -f Dockerfile -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }} .

      - name: Login to ACR
        run: az acr login --name $ACR_NAME

      - name: Push image
        run: |
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Update Container App
        run: |
          az containerapp registry set \
            --name $CONTAINER_APP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --server $ACR_NAME.azurecr.io \
            --identity system
          az containerapp update \
            --name $CONTAINER_APP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --image $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}

      - name: Get Container App URL
        id: get-url
        run: |
          FQDN=$(az containerapp show \
            --name $CONTAINER_APP_NAME \
            --resource-group $AZURE_RESOURCE_GROUP \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "fqdn=$FQDN" >> "$GITHUB_OUTPUT"
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          FQDN="${{ steps.get-url.outputs.fqdn }}"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$FQDN/healthz/live")
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i: status $STATUS — retrying in 15s"
            sleep 15
          done
          echo "::error::Smoke test failed after 10 attempts"
          exit 1

      - name: Print environment URLs
        run: |
          FQDN="${{ steps.get-url.outputs.fqdn }}"
          {
            echo "## Backend deployed"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Backend health | https://$FQDN/healthz/live |"
            echo "| API docs | https://$FQDN/scalar/v1 |"
          } >> "$GITHUB_STEP_SUMMARY"
