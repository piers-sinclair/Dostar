name: Dev — spin up

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  actions: write
  secrets: write

jobs:
  spinup:
    name: Spin up dev environment
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]               && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]               && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ]         && MISSING+=("AZURE_SUBSCRIPTION_ID")
          [ -z "$AZURE_POSTGRES_ADMIN_PASSWORD" ] && MISSING+=("AZURE_POSTGRES_ADMIN_PASSWORD")
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            echo "Follow docs/deploy-setup.md to configure OIDC credentials and deployment secrets."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        env:
          AZURE_POSTGRES_ADMIN_PASSWORD: ${{ secrets.AZURE_POSTGRES_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --location australiaeast \
            --template-file infra/main.bicep \
            --parameters infra/main.parameters.dev.bicepparam \
            --only-show-errors

      - name: Bootstrap RBAC — CI principal AcrPush
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          ACR_NAME="crdostardevaue001"
          ACR_ID=$(az acr show --name "$ACR_NAME" --query id -o tsv)
          SP_OBJECT_ID=$(az ad sp show --id "$AZURE_CLIENT_ID" --query id -o tsv)

          EXISTING=$(az role assignment list \
            --assignee "$SP_OBJECT_ID" \
            --role "AcrPush" \
            --scope "$ACR_ID" \
            --query "[0].id" -o tsv 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "AcrPush role assignment already exists — skipping"
          else
            az role assignment create \
              --assignee-object-id "$SP_OBJECT_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPush" \
              --scope "$ACR_ID"
          fi

      - name: Bootstrap RBAC — Container App AcrPull
        run: |
          ACR_NAME="crdostardevaue001"
          ACR_ID=$(az acr show --name "$ACR_NAME" --query id -o tsv)
          CA_PRINCIPAL_ID=$(az containerapp show \
            --name "ca-dostar-dev-aue-001" \
            --resource-group "rg-dostar-dev-aue-001" \
            --query identity.principalId -o tsv)

          EXISTING=$(az role assignment list \
            --assignee "$CA_PRINCIPAL_ID" \
            --role "AcrPull" \
            --scope "$ACR_ID" \
            --query "[0].id" -o tsv 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "Container App AcrPull role assignment already exists — skipping"
          else
            az role assignment create \
              --assignee-object-id "$CA_PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "AcrPull" \
              --scope "$ACR_ID"
          fi

      - name: Bootstrap RBAC — Container App Key Vault Secrets User
        run: |
          KV_NAME="kv-dostar-dev-aue-001"
          KV_ID=$(az keyvault show --name "$KV_NAME" --query id -o tsv)
          CA_PRINCIPAL_ID=$(az containerapp show \
            --name "ca-dostar-dev-aue-001" \
            --resource-group "rg-dostar-dev-aue-001" \
            --query identity.principalId -o tsv)

          EXISTING=$(az role assignment list \
            --assignee "$CA_PRINCIPAL_ID" \
            --role "Key Vault Secrets User" \
            --scope "$KV_ID" \
            --query "[0].id" -o tsv 2>/dev/null)

          if [ -n "$EXISTING" ]; then
            echo "Key Vault Secrets User role assignment already exists — skipping"
          else
            az role assignment create \
              --assignee-object-id "$CA_PRINCIPAL_ID" \
              --assignee-principal-type ServicePrincipal \
              --role "Key Vault Secrets User" \
              --scope "$KV_ID"
          fi

      - name: Refresh Static Web App deploy token
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name stapp-dostar-dev-aue-001 \
            --resource-group rg-dostar-dev-aue-001 \
            --query "properties.apiKey" -o tsv)
          gh secret set AZURE_STATIC_WEB_APPS_API_TOKEN_DEV --body "$TOKEN"
          echo "AZURE_STATIC_WEB_APPS_API_TOKEN_DEV updated."

      - name: Trigger backend deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cd-dev.yml --repo "${{ github.repository }}"

      - name: Trigger frontend deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run cd-frontend-dev.yml --repo "${{ github.repository }}"
          echo "Backend and frontend deploy workflows triggered — dev environment will be fully ready shortly."
