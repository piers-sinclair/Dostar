name: Testing — UI

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "tests/Dostar.UITests/**"

jobs:
  ui:
    name: Playwright
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/Dostar.UITests/pnpm-lock.yaml') }}

      - name: Install UI test deps
        run: pnpm install --frozen-lockfile
        working-directory: tests/Dostar.UITests

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium
        working-directory: tests/Dostar.UITests

      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install-deps chromium
        working-directory: tests/Dostar.UITests

      - name: Serve frontend
        run: pnpm preview --port 5173 &
        working-directory: frontend

      - name: Wait for frontend
        run: |
          for i in $(seq 1 10); do
            curl -sf http://localhost:5173 && exit 0
            echo "Waiting for frontend... ($i/10)"
            sleep 2
          done
          echo "::error::Frontend never started on port 5173"
          exit 1

      - name: Run Playwright tests
        run: pnpm exec playwright test
        working-directory: tests/Dostar.UITests
        env:
          UI_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: tests/Dostar.UITests/playwright-report/
          retention-days: 7
