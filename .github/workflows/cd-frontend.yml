name: CD — deploy frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: choice
        options: [dev, prod]
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy frontend (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'dev' }}
      url: ${{ steps.print-urls.outputs.url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          MISSING=()
          [ -z "$AZURE_CLIENT_ID" ]       && MISSING+=("AZURE_CLIENT_ID")
          [ -z "$AZURE_TENANT_ID" ]       && MISSING+=("AZURE_TENANT_ID")
          [ -z "$AZURE_SUBSCRIPTION_ID" ] && MISSING+=("AZURE_SUBSCRIPTION_ID")

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Missing required secrets: ${MISSING[*]}"
            echo "Follow docs/deploy-setup.md to configure OIDC credentials and add these secrets."
            exit 1
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve SWA deployment token from Key Vault
        id: swa_token
        run: |
          KV_NAME="kv-dostar-${{ inputs.environment || 'dev' }}-aue-001"
          TOKEN=$(az keyvault secret show \
            --vault-name "$KV_NAME" \
            --name swa-deployment-token \
            --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Get backend URL
        id: backend
        run: |
          FQDN=$(az containerapp show \
            --name "ca-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --resource-group "rg-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.backend.outputs.url }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true

      - name: Print environment URLs
        id: print-urls
        run: |
          HOSTNAME=$(az staticwebapp show \
            --name "stapp-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --resource-group "rg-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --query defaultHostname -o tsv)
          echo "url=https://$HOSTNAME" >> "$GITHUB_OUTPUT"
          {
            echo "## Frontend deployed"
            echo ""
            echo "| Service | URL |"
            echo "|---------|-----|"
            echo "| Frontend | https://$HOSTNAME |"
          } >> "$GITHUB_STEP_SUMMARY"
