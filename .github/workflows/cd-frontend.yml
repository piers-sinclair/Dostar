name: CD — deploy frontend

on:
  push:
    branches: ["main"]
    paths:
      - "frontend/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: choice
        options: [dev, prod]
  workflow_call:
    inputs:
      environment:
        description: Target environment
        required: false
        default: dev
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy frontend (${{ inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies (strict)
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve SWA deployment token from Key Vault
        id: swa_token
        run: |
          KV_NAME="kv-dostar-${{ inputs.environment || 'dev' }}-aue-001"
          TOKEN=$(az keyvault secret show \
            --vault-name "$KV_NAME" \
            --name swa-deployment-token \
            --query value -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Get backend URL
        id: backend
        run: |
          FQDN=$(az containerapp show \
            --name "ca-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --resource-group "rg-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Build
        run: pnpm build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.backend.outputs.url }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa_token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true

      - name: Get Static Web App URL
        id: get-url
        run: |
          HOSTNAME=$(az staticwebapp show \
            --name "stapp-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --resource-group "rg-dostar-${{ inputs.environment || 'dev' }}-aue-001" \
            --query defaultHostname -o tsv)
          echo "hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"
          echo "url=https://$HOSTNAME" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: |
          URL="${{ steps.get-url.outputs.url }}"
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Smoke test failed"
          exit 1
