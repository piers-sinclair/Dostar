name: dostar
metadata:
  template: dostar

hooks:
  preprovision:
    shell: sh
    run: infra/scripts/predeploy.sh
    interactive: false
    continueOnError: false

infra:
  provider: bicep
  path: infra
  module: main

services:
  api:
    project: ./backend/Dostar.Api
    language: dotnet
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

  web:
    project: ./frontend
    host: staticwebapp
